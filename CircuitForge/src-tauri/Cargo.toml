[package]
name = "circuitforge"
version = "0.1.0"
description = "CircuitForge: Verified Open-Source SPICE Circuit Workbench"
authors = ["CircuitForge Contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "circuitforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tempfile = "3.18"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2.8.3"

[dev-dependencies]
tempfile = "3.18"
